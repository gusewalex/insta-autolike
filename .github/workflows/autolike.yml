name: Instagram read-only monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: instagram-readonly-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TZ: Europe/Kyiv
      IG_USERNAME: ${{ secrets.IG_USERNAME }}
      IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
      IG_TOTP_SEED: ${{ secrets.IG_TOTP_SEED }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FEED_MAX_AGE_HOURS: "48"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore encrypted state
        uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: instagram-monitor-${{ github.run_id }}
          restore-keys: |
            instagram-monitor-

      - name: Decrypt state
        shell: bash
        run: |
          set -euo pipefail
          if [ -f state.enc ]; then
            if [ -z "$STATE_KEY" ]; then
              echo "STATE_KEY secret is missing." >&2
              exit 1
            fi
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STATE_KEY -in state.enc | tar -xz
          fi

      - name: Run read-only monitor
        run: python insta_monitor.py --once

      - name: Encrypt state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          files=()
          [ -f session.json ] && files+=(session.json)
          [ -f state.json ] && files+=(state.json)
          if [ "${#files[@]}" -gt 0 ]; then
            tar -czf - "${files[@]}" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STATE_KEY -out state.enc
          fi

      - name: Save encrypted state
        if: always() && hashFiles('state.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: state.enc
          key: instagram-monitor-${{ github.run_id }}
