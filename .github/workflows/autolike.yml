name: autolike

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub не гарантує точність: запуски часто запізнюються на кілька хвилин
  workflow_dispatch:
    inputs:
      force:
        description: "Скасувати паузу після обмеження Instagram"
        type: boolean
        default: false

concurrency:
  group: autolike
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Europe/Kyiv                      # для «тихих годин» (01:00-07:00)
      IG_USERNAME: ${{ secrets.IG_USERNAME }}
      IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
      IG_TOTP_SEED: ${{ secrets.IG_TOTP_SEED }}   # необов'язково, лише для 2FA через додаток
      STATE_KEY: ${{ secrets.STATE_KEY }}
      FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
      RUN_BUDGET_SEC: "240"
      LOG_USERNAMES: "0"                   # у публічному репозиторії логи бачать усі

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore encrypted state
        uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: autolike-${{ github.run_id }}
          restore-keys: autolike-

      - name: Decrypt state or seed session
        env:
          IG_SESSION_B64: ${{ secrets.IG_SESSION_B64 }}
        run: |
          if [ -f state.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STATE_KEY -in state.enc | tar -xz
          fi
          if [ ! -f session.json ] && [ -n "$IG_SESSION_B64" ]; then
            echo "$IG_SESSION_B64" | base64 -d > session.json
          fi

      - name: Run
        run: python insta_autolike.py --once

      - name: Encrypt state
        if: always()
        run: |
          files=""
          [ -f session.json ] && files="$files session.json"
          [ -f state.json ] && files="$files state.json"
          if [ -n "$files" ]; then
            rm -f state.enc
            tar -cz $files | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STATE_KEY -out state.enc
          fi

      - name: Save encrypted state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.enc
          key: autolike-${{ github.run_id }}
